version: '3.8'

services:
  neo4j:
    image: neo4j:5.23-community
    container_name: vn_realestate_neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-neo4j_password}
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - vn_realestate_net

  chromadb:
    image: chromadb/chroma:latest
    container_name: vn_realestate_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - CHROMA_SERVER_GRPC_PORT=50051
    networks:
      - vn_realestate_net

  ollama:
    image: ollama/ollama:latest
    container_name: vn_realestate_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - vn_realestate_net

networks:
  vn_realestate_net:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  chromadb_data:
  ollama_data:
